<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Frete Manual</title>
    <link rel="stylesheet" href="../static/styles.css" />
    <style>
        body { font-family: Arial; background: #f0f8ff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #003087; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn { display: block; width: 100%; padding: 12px; background: #003087; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #00205b; }
        .back { background: #6c757d; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ADICIONAR FRETE MANUAL</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin: 10px 0;">
                    {% for message in messages %}
                        <p><strong>{{ message }}</strong></p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Origem:</label>
            <input type="text" name="origem" required placeholder="Ex: São Paulo, SP">

            <label>Destino:</label>
            <input type="text" name="destino" required placeholder="Ex: Rio de Janeiro, RJ">

            <label>Veículo:</label>
            <select name="veiculo" required>
                <option value="carro">Carro</option>
                <option value="moto">Moto</option>
                <option value="caminhao">Caminhão</option>
                <option value="van">Van</option>
            </select>

            <label>Distância (km):</label>
            <input type="number" step="0.01" name="distancia" required placeholder="Ex: 430.50">

            <label>Pedágio (R$):</label>
            <input type="number" step="0.01" name="pedagio" value="0.00" required>

            <label>Combustível (R$):</label>
            <input type="number" step="0.01" name="combustivel" required placeholder="Ex: 980.75">

            <label>Total (R$):</label>
            <input type="number" step="0.01" name="total" required placeholder="Ex: 1025.75">

            <button type="submit" class="btn">Salvar Frete Manual</button>
        </form>

        <a href="{{ url_for('dir_pagina_frete') }}" class="btn back">Voltar ao Cálculo</a>
    </div>
</body>
</html>
