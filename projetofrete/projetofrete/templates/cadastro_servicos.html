<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Viagem - RotaFácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/base.css">
  <link rel="stylesheet" href="../static/css/layout.css">
  <link rel="stylesheet" href="../static/css/components.css">
  <link rel="stylesheet" href="../static/css/pages/form.css">
  <link rel="stylesheet" href="../static/css/pages/cadastro-servicos.css">

</head>

<body class="page-soft">

  <header class="topbar">
    <div class="container">
      <a href="/" class="brand" aria-label="logistíca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s-6-5.2-6-11a6 6 0 1 1 12 0c0 5.8-6 11-6 11Z"></path>
          <circle cx="12" cy="10" r="2.2"></circle>
        </svg>
        <span>Logística</span>
      </a>

      <nav class="menu">
        <a href="/">Início</a>
        <div class="dropdown">
          <a href="#">Cadastros</a>
          <div class="dropdown-content">
            <a href="{{ url_for('cliente.tela_clientes') }}">Clientes</a>
            <a href="{{ url_for('veiculo.tela_veiculos') }}">Veículo</a>
            <a href ="{{ url_for('motorista.tela_motoristas') }}">Motorista</a>
          </div>
        </div>
        <a  class="active" href="/consulta_servicos">Serviços</a>
      </nav>
    </div>
  </header>

  <main class="section form-page">
    <div class="container">
      <div class="form-wrapper">
        <div class="botao-voltar">
          <a href="/consulta_servicos" class="btn btn-voltar">          
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5"></path>
              <path d="M12 19l-7-7 7-7"></path>
            </svg>
            Voltar
          </a>
        </div>
      <div class="form-card">
        <form id="serviceForm" class="formul" method="POST" action="/add_servico">
          <input type="hidden" id="despesas_json" name="despesas_json" value="[]">
          <div class="form-header">
            <h1>Nova Viagem</h1>
            <p>Preencha os dados da sua viagem para calcular custos e gerenciar suas rotas</p>
          </div>
          <div class="form-select two-columns"> 
            <div class="form-left">
              <a href="#" class="tab-link active" data-tab="dados">Dados da Viagem</a>
            </div>
            <div class="form-right">
              <a href="#" class="tab-link" data-tab="despesas">Despesas</a>
            </div>
          </div>
          
            <div id="dados" class="tab-content active">
              
                <div class="form-grid three-columns">

                  <div class="form-group">
                    <label for="veiculo">Veículo</label>
                    <select id="veiculo" name="id_veiculo" required>
                      <option value="">Selecione</option>
                      {% for veiculo in veiculos %}
                        <option value="{{ veiculo.id_veiculo }}">{{ veiculo.modelo }}</option>
                      {% endfor %}
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="cliente">Cliente</label>
                    <select id="cliente" name="id_cliente" required>
                      <option value="">Selecione</option>
                      {% for cliente in clientes %}
                        <option value="{{ cliente.id_cliente }}">{{ cliente.nome }}</option>
                      {% endfor %}
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="motorista">Motorista</label>
                    <select id="motorista" name="id_motorista" required>
                      <option value="">Selecione</option>
                      {% for motorista in motoristas %}
                        <option value="{{ motorista.id_motorista }}">{{ motorista.nome }}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label for="origem">Origem *</label>
                  <input type="text" id="origem" name="origem" placeholder="Ex: São Paulo, SP">
                </div>

                <div class="form-group">
                  <label for="destino">Destino *</label>
                  <input type="text" id="destino" name="destino" placeholder="Ex: Rio de Janeiro, RJ">
                </div>

                <div class="form-grid two-columns">
                  <div class="form-group">
                    <label for="distancia">Distância (km) *</label>
                    <div class="despesa-line">
                      <div class="form-group campo-distancia">
                        <input type="number" step="0.01" id="distancia" name="distancia" placeholder="450" readonly>
                        <input type="hidden" id="distancia_manual" name="distancia_manual" value="0">
                      </div>
                      <div class="form-group botao-calcular-distancia">
                        <button type="button" id="btnCalcularDistancia">Calcular distância</button>
                      </div>
                    </div>

                    <div style="margin-top: 8px;">
                      <label style="display: inline-flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="toggle_distancia_manual">
                        Informar distância manualmente
                      </label>
                    
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="consumo">Consumo (km/l)</label>
                    <input type="number" step="0.1" id="consumo" name="consumo" placeholder="12.5">
                  </div>
                </div>

                <div class="form-grid two-columns">
                  <div class="form-group">
                    <label for="combustivel">Valor do Combustível (R$/L)</label>
                    <input type="number" step="0.01" id="combustivel" name="combustivel" placeholder="5.50">
                  </div>

                  <div class="form-group">
                    <label for="vazio">Outras Despesas (R$)</label>
                    <input type="number" step="0.01" id="vazio" name="vazio" placeholder="50.00">
                  </div>
                </div>
            </div>
            <div id="despesas" class="tab-content">
              <div class="add-despesa">
                <div class="title-despesa"> 
                  <h3>Adicionar Despesa</h3>
                </div>

                <div class="despesa-line">
                  <div class="form-group campo-nome">
                    <label for="despesa">Despesa</label>
                    <input type="text" id="despesa" name="despesa" placeholder="Ex: Pedágio, Alimentação">
                  </div>

                  <div class="form-group campo-valor">
                    <label for="valor">Valor(R$)</label>
                    <input type="number" step="0.01" id="valor" name="valor" placeholder="Ex: 0.00">
                  </div>

                  <div class="form-group botao-incluir">
                    <button class="incluir-btn" type="button" id="btnAdicionar">+</button>
                  </div>
                </div>
              </div>
              <div class="add-despesa">
                <div id="lista-despesas"></div>
              </div>
              <div class="add-despesa total">
                <span class="nome-despesa">Total:</span>
                <strong id="total-despesas">R$ 0,00</strong>

              </div>
              
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-save">
                Salvar Viagem
              </button>
              <a href="/consulta_servicos" class="btn btn-secondary"onclick="return confirm('Tem certeza que deseja cancelar? Os dados não salvos serão perdidos.');">Cancelar</a>
            </div>
        </form>
      </div>
      </div>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/cadastro_servicos.js') }}"></script>

</body>
</html>
