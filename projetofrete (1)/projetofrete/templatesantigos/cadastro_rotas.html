<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGÍSTICA</title>
    <link rel="stylesheet" href="../static/styles.css" />
    <script src="../static/setup.js"></script>
  </head>

  <body>
    <div class="interface">
      <header>
        <div class="display_logo">
          <a href="/">
            <img src="../static/logo.png" alt="Logo" class="logo" />
            <h1>LOGÍSTICA</h1>
          </a>
        </div>
        <nav>
          <ul class="menu">
            <li><a href="/cadastro_clientes">CLIENTES</a></li>
            <li><a href="/cadastro_servicos">SERVIÇOS</a></li>
            <li><a href="/cadastro_rotas">ROTAS</a></li>
          </ul>
        </nav>
      </header>

      <div class="cad">
        <section id="rotas">
          <h2>ROTAS</h2>
          <form id="rotasForm" class="formul" method="POST" action="/add_rotas">
            <input type="text" name="rotaID" placeholder="Somente para busca - ID da rota" />
            <input type="text" name="rotasName" placeholder="Rota" />
            
            <input
              type="text"
              name="rotasDesc"
              placeholder="Descrição do rota"
            />
            <input
              type="number"
              name="rotaPrice"
              placeholder="Preço"
              step="0.01"
            />

            <div class="form_buttons">
              <button type="submit" formaction="/proc_rota" formmethod="get" class="addItem">Rotas Cadastradas</button>
              <button type="submit" class="addItem">Salvar Rota</button>
            </div>
          </form>

          <table class="display_table">
            <thead>
              <tr>
                <th class="item">Logradouro</th>
                <th class="item">Número</th>
                <th class="item">Complemento</th>
                <th class="item">Bairro</th>
                <th class="item">CEP</th>
                <th class="item">Excluir</th>
              </tr>
            </thead>
            
            <tbody id="rota-list">
              {% for row in rows %}
              <tr>
                {% for item in row %}
                  <td>{{ item }}</td>
                {% endfor %}
                <td class="dltitem-btn">
                    <form method="POST" action="/dlt_rota">
                      <input type="hidden" name="codigo" value="{{ row[0] }}">
                      <button type="submit" class="delete-btn">X</button>
                    </form>                    
                  </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </section>
      </div>
    </div>
    
    {% if alert %}
      <script class="alert">
          alert("{{ alert }}");
      </script>
    {% endif %}
  </body>
</html>
