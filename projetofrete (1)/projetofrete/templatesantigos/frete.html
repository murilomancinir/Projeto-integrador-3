<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRETE - LOGÍSTICA</title>
  <link rel="stylesheet" href="../static/styles.css" />
  <script src="../static/setup.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <div class="interface">
    <header>
      <div class="display_logo">
        <a href="/">
          <img src="../static/logo.png" alt="Logo" class="logo" />
          <h1>LOGÍSTICA</h1>
        </a>
      </div>
      <nav>
        <ul class="menu">
          <li><a href="/cadastro_clientes">CLIENTES</a></li>
          <li><a href="/cadastro_servicos">SERVIÇOS</a></li>
          <li><a href="/frete" class="active">FRETE</a></li>
        </ul>
      </nav>
    </header>

    <div class="cad">
      <section id="frete">
        <h2>CALCULAR FRETE<br /></h2>

        <!-- Mensagens de erro com flash -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger">
              {% for message in messages %}
                {{ message }}<br>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Formulário -->
        <form method="POST" class="formul">
          <input type="text" name="origem" placeholder="Origem (ex: São Paulo, SP)" required />
          <input type="text" name="destino" placeholder="Destino (ex: Rio de Janeiro, RJ)" required />

          <select name="veiculo" required>
            <option value="" disabled selected>Selecione o veículo</option>
            <option value="carro">Carro (12 km/L)</option>
            <option value="moto">Moto (25 km/L)</option>
            <option value="caminhao">Caminhão (4.5 km/L)</option>
          </select>

          <input type="number" name="preco_combustivel" step="0.01" placeholder="Preço do combustível (R$/L)" required />

          <div class="form_buttons">
            <button type="submit" class="addItem">
              Calcular Frete
            </button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <!-- REMOVIDO: {% if alert %} ... {% endif %} -->
</body>
</html>
